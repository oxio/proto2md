name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag format (vX.Y.Z with optional -alpha.N/-beta.N suffix)
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "::error::'${TAG}' does not match the required format v<major>.<minor>.<patch> with an optional -alpha.N or -beta.N suffix (e.g. v1.0.0, v1.0.0-beta.1)."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::'${TAG}' is not a tag in this repository."
            exit 1
          fi

      - name: Verify tag is on the main branch
        run: |
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag '${TAG}' points to a commit that is not on the 'main' branch. Only tags on 'main' are released."
            exit 1
          fi

  check:
    name: Check
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.44.1

      - name: Run checks
        run: task check

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.44.1

      - name: Build
        run: task "build:${{ matrix.goos }}-${{ matrix.goarch }}" "VERSION=${TAG}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proto2md-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: bin/proto2md-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXTRA_ARGS=()
          if [[ "${TAG}" =~ -(alpha|beta)\.[0-9]+$ ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          gh release create "${TAG}" dist/proto2md-* \
            --title "${TAG}" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
